{% extends "admin/base_site.html" %}
{% load static %}

{% block title %}Credential Setup Error{% endblock %}

{% block extrastyle %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    /* Hide admin chrome for this public-facing page */
    #header,
    .breadcrumbs {
        display: none;
    }
    body {
        background: linear-gradient(135deg, #0f172a, #1f2a44);
        font-family: "Helvetica Neue", Arial, sans-serif;
        color: #0b1727;
    }
    .page-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .card {
        width: 100%;
        max-width: 480px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 20px 70px rgba(15, 23, 42, 0.25);
        padding: 26px;
        text-align: center;
    }
    .card h1 {
        font-size: 1.4rem;
        margin-bottom: 10px;
        color: #0f172a;
    }
    .error-message {
        color: #dc2626;
        margin-bottom: 16px;
        font-weight: 600;
    }
    .contact-info {
        color: #475569;
        font-size: 0.95rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="page-container">
    <div class="card">
        <h1>Setup Error</h1>
        
        <div class="error-message">
            {{ error }}
        </div>
        
        {% if show_contact %}
        <div class="contact-info">
            Please contact your administrator for assistance.
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
