{% extends "admin/base_site.html" %}
{% load static %}

{% block extrastyle %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    /* Hide admin chrome for this public-facing page */
    #header,
    .breadcrumbs {
        display: none;
    }

    .error-container {
        max-width: 600px;
        margin: 20px auto;
        padding: 20px;
        text-align: center;
    }
    
    .error-message {
        color: #dc3545;
        margin-bottom: 20px;
    }
    
    .contact-info {
        color: #666;
        font-size: 0.9em;
    }
</style>
{% endblock %}

{% block content %}
<div class="error-container">
    <h2>Setup Error</h2>
    
    <div class="error-message">
        {{ error }}
    </div>
    
    {% if show_contact %}
    <div class="contact-info">
        Please contact your administrator for assistance.
    </div>
    {% endif %}
</div>
{% endblock %}
