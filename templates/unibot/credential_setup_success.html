{% extends "admin/base_site.html" %}
{% load static %}

{% block title %}Credential Setup Complete{% endblock %}

{% block extrastyle %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    /* Hide admin chrome for this public-facing page */
    #header,
    .breadcrumbs {
        display: none;
    }
    body {
        background: linear-gradient(135deg, #0f172a, #1f2a44);
        font-family: "Helvetica Neue", Arial, sans-serif;
        color: #0b1727;
    }
    .page-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .card {
        width: 100%;
        max-width: 480px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 20px 70px rgba(15, 23, 42, 0.25);
        padding: 26px;
        text-align: center;
    }
    .success-message {
        color: #16a34a;
        margin-bottom: 16px;
        font-weight: 600;
    }
    .success-icon {
        font-size: 48px;
        margin-bottom: 14px;
    }
    .card h1 {
        font-size: 1.4rem;
        margin-bottom: 10px;
        color: #0f172a;
    }
</style>
{% endblock %}

{% block content %}
<div class="page-container">
    <div class="card">
        <div class="success-icon">✓</div>
        <h1>Setup Complete</h1>
        
        <div class="success-message">
            Your credentials have been securely saved.
        </div>
        
        <p>You can now close this window.</p>
    </div>
</div>
{% endblock %}
